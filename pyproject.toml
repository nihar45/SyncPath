[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "syncpath-lab"
version = "0.1.0"
description = "Deterministic network resilience simulator and support retrieval"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
syncpath = "syncpath.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
